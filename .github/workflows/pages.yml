name: Deploy blog to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "breast-size-control.html"
      - "breast-size-control.md"
      - "assets/**"
      - "images/**"
      - "workflows/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The whole repo is uploaded, not just docs/, because the blog pages
      # reference ../images/ and ../workflows/ by relative path. Uploading the
      # repository root makes those URLs resolve under the Pages base URL.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
